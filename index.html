<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#173f63"><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icon.svg"><title>家計簿</title><style>:root{--n:#173f63;--b:#2f75b5;--p:#eef6fb;--l:#d8e2ea;--t:#1f2937;--m:#667085;--g:#18794e;--r:#b42318}*{box-sizing:border-box}body{margin:0;background:#f5f7fa;color:var(--t);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif}.wrap{max-width:1050px;margin:auto;padding:16px}header{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}h1{margin:0}.sub{color:var(--m);margin:4px 0 14px}.badge{background:#eaf8f0;color:var(--g);padding:6px 10px;border-radius:999px;font-size:12px;font-weight:700}.tabs{display:flex;gap:7px;position:sticky;top:0;background:#f5f7fa;padding:8px 0;z-index:5;flex-wrap:wrap}.tabs button,.btn{border:0;border-radius:10px;padding:10px 14px;font-weight:700;cursor:pointer}.tabs button{background:#e7eef4;color:var(--n)}.tabs button.on,.primary{background:var(--n);color:#fff}.secondary{background:#eaf2f8;color:var(--n)}.danger{background:#fff0ee;color:var(--r)}.card{background:#fff;border:1px solid var(--l);border-radius:16px;padding:16px;margin:14px 0;box-shadow:0 5px 20px rgba(23,63,99,.05)}.panel{display:none}.panel.on{display:block}.grid{display:grid;grid-template-columns:1fr 1.4fr .8fr 1fr;gap:10px}.field{display:flex;flex-direction:column;gap:5px}.wide{grid-column:1/-1}label{font-size:13px;font-weight:700}input,select,textarea{width:100%;padding:11px;border:1px solid #b7c5d0;border-radius:10px;font-size:16px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.kpi{background:var(--p);padding:14px;border-radius:12px}.kpi span{display:block;color:var(--m);font-size:12px}.kpi strong{display:block;font-size:22px;margin-top:5px}.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}.barrow{display:grid;grid-template-columns:105px 1fr 85px;gap:9px;align-items:center;margin:9px 0;font-size:13px}.track{height:12px;background:#e9eff4;border-radius:999px;overflow:hidden}.bar{height:100%;background:var(--b)}.right{text-align:right}.note{font-size:13px;color:var(--m);line-height:1.55}.warn{background:#fff8e4;border:1px solid #ecd48d;padding:10px 12px;border-radius:10px}.tablewrap{overflow:auto;max-height:560px;border:1px solid var(--l);border-radius:12px}table{width:100%;border-collapse:collapse;min-width:760px}th,td{padding:9px;border-bottom:1px solid #e7edf2;text-align:left;font-size:13px}th{background:#f5f9fc;position:sticky;top:0}.amount{text-align:right}.small{font-size:12px;color:var(--m)}@media(max-width:760px){header{flex-direction:column}.grid{grid-template-columns:1fr 1fr}.kpis,.two{grid-template-columns:1fr 1fr}}@media(max-width:520px){.wrap{padding:10px}.grid,.kpis,.two{grid-template-columns:1fr}.wide{grid-column:auto}.barrow{grid-template-columns:88px 1fr 74px}}</style></head><body><div class="wrap"><header><div><h1>家計簿</h1><p class="sub">入力・集計・分析。データはこの端末のブラウザ内に保存します。</p></div><span class="badge">個人データは端末内</span></header><nav class="tabs"><button class="on" data-p="input">＋ 入力</button><button data-p="analysis">集計・分析</button><button data-p="history">履歴</button></nav><section id="input" class="panel on"><div class="card"><form id="form"><div class="grid"><div class="field"><label>日付</label><input id="date" type="date"></div><div class="field"><label>内容</label><input id="content" required placeholder="例：イオン"></div><div class="field"><label>金額</label><input id="amount" type="number" min="1" required placeholder="1500"></div><div class="field"><label>カテゴリ</label><select id="category"></select></div><div class="field wide"><label>メモ</label><input id="memo" placeholder="任意"></div></div><div class="actions"><button class="btn primary">＋ 追加</button><button class="btn secondary" type="button" id="today">今日</button><button class="btn secondary" type="button" id="toAnalysis">分析を見る</button></div></form><p class="warn">初回だけ「履歴 → JSON復元」から、ChatGPTで受け取った家計簿バックアップを読み込んでください。</p></div><div class="card"><div class="kpis"><div class="kpi"><span>総支出</span><strong id="total">0円</strong></div><div class="kpi"><span>記録件数</span><strong id="count">0件</strong></div><div class="kpi"><span>最新月</span><strong id="latest">0円</strong><small id="latestLabel"></small></div><div class="kpi"><span>日付未設定</span><strong id="undated">0円</strong></div></div></div></section><section id="analysis" class="panel"><div class="card"><div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap"><div><h2 style="margin:0">月の分析</h2><div class="note">日付未設定の支出は月別分析に含めません。</div></div><select id="month" style="max-width:180px"></select></div><div class="kpis" style="margin-top:12px"><div class="kpi"><span>選択月</span><strong id="mTotal">0円</strong></div><div class="kpi"><span>前月との差</span><strong id="mDiff">—</strong></div><div class="kpi"><span>平均</span><strong id="mAvg">0円</strong></div><div class="kpi"><span>最大1件</span><strong id="mMax">0円</strong><small id="mMaxLabel"></small></div></div></div><div class="two"><div class="card"><h3>カテゴリ別</h3><div id="cats"></div></div><div class="card"><h3>支出先ランキング</h3><div id="merchants"></div></div></div><div class="card"><h3>その月の理由</h3><textarea id="reason" rows="4" placeholder="例：帰省で移動が多かった"></textarea><div class="actions"><button class="btn primary" id="saveReason" type="button">保存</button></div></div></section><section id="history" class="panel"><div class="card"><div class="actions" style="margin-top:0"><input id="search" type="search" placeholder="検索" style="max-width:240px"><button class="btn secondary" id="csv" type="button">CSV</button><button class="btn secondary" id="backup" type="button">JSONバックアップ</button><button class="btn secondary" id="restore" type="button">JSON復元</button><input id="restoreFile" type="file" accept="application/json,.json" hidden><button class="btn danger" id="reset" type="button">空にする</button></div><p class="small" id="summary"></p><div class="tablewrap"><table><thead><tr><th>日付</th><th>内容</th><th class="amount">金額</th><th>カテゴリ</th><th>メモ</th><th></th></tr></thead><tbody id="tbody"></tbody></table></div></div></section></div><script>const KEY='kakeibo_entries_v1',RKEY='kakeibo_reasons_v1';const CATS=['食費','食費・生活費','外食','日用品','日用品・医薬品','医療費','医療・医薬品','交通費','通信費','通販','交際費','健康','食費・雑費','食費・土産','未分類','その他'];const $=x=>document.getElementById(x),yen=n=>new Intl.NumberFormat('ja-JP').format(Math.round(Number(n)||0))+'円',sum=a=>a.reduce((s,x)=>s+(+x.amount||0),0),clone=x=>JSON.parse(JSON.stringify(x)),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let data=(()=>{try{return JSON.parse(localStorage.getItem(KEY)||'[]')}catch{return[]}})();let reasons=(()=>{try{return JSON.parse(localStorage.getItem(RKEY)||'{}')}catch{return{}}})();function save(){localStorage.setItem(KEY,JSON.stringify(data))}function saveR(){localStorage.setItem(RKEY,JSON.stringify(reasons))}function months(){return[...new Set(data.filter(x=>x.date).map(x=>x.date.slice(0,7)))].sort()}function prevMonth(ym){let[y,m]=ym.split('-').map(Number),d=new Date(y,m-2,1);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')}function renderQuick(){let ms=months(),lm=ms.at(-1)||'';$('total').textContent=yen(sum(data));$('count').textContent=data.length+'件';$('latest').textContent=yen(sum(data.filter(x=>lm&&x.date.startsWith(lm))));$('latestLabel').textContent=lm?lm.replace('-','年')+'月':'';$('undated').textContent=yen(sum(data.filter(x=>!x.date)))}function renderHistory(){let q=$('search').value.toLowerCase(),rows=data.map((x,i)=>({...x,_i:i})).filter(x=>!q||[x.date,x.content,x.category,x.memo].join(' ').toLowerCase().includes(q)).sort((a,b)=>(b.date||'').localeCompare(a.date||''));$('summary').textContent='表示中 '+rows.length+'件・'+yen(sum(rows));$('tbody').innerHTML=rows.map(x=>`<tr><td>${esc(x.date||'未設定')}</td><td>${esc(x.content)}</td><td class="amount">${yen(x.amount)}</td><td>${esc(x.category)}</td><td>${esc(x.memo||'')}</td><td><button class="btn danger" style="padding:4px 7px" data-i="${x._i}">削除</button></td></tr>`).join('')}function bars(obj){let rs=Object.entries(obj).sort((a,b)=>b[1]-a[1]),mx=rs[0]?.[1]||1;return rs.map(([k,v])=>`<div class="barrow"><div>${esc(k)}</div><div class="track"><div class="bar" style="width:${Math.max(2,v/mx*100)}%"></div></div><div class="right">${yen(v)}</div></div>`).join('')||'<p class="small">データなし</p>'}function renderAnalysis(){let ms=months(),old=$('month').value;$('month').innerHTML=ms.slice().reverse().map(m=>`<option>${m}</option>`).join('');$('month').value=ms.includes(old)?old:(ms.at(-1)||'');let ym=$('month').value;if(!ym)return;let a=data.filter(x=>x.date.startsWith(ym)),t=sum(a),p=prevMonth(ym),pa=data.filter(x=>x.date.startsWith(p)),pt=sum(pa),d=t-pt,mx=[...a].sort((x,y)=>y.amount-x.amount)[0];$('mTotal').textContent=yen(t);$('mDiff').textContent=pa.length?(d>=0?'+':'')+yen(d):'比較なし';$('mAvg').textContent=yen(a.length?t/a.length:0);$('mMax').textContent=yen(mx?.amount||0);$('mMaxLabel').textContent=mx?.content||'';let g=k=>a.reduce((o,x)=>(o[x[k]||'未設定']=(o[x[k]||'未設定']||0)+(+x.amount||0),o),{});$('cats').innerHTML=bars(g('category'));$('merchants').innerHTML=bars(g('content'));$('reason').value=reasons[ym]||''}function render(){renderQuick();renderHistory();if($('analysis').classList.contains('on'))renderAnalysis()}CATS.forEach(c=>$('category').insertAdjacentHTML('beforeend',`<option>${c}</option>`));document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('on',x===b));document.querySelectorAll('.panel').forEach(x=>x.classList.toggle('on',x.id===b.dataset.p));if(b.dataset.p==='analysis')renderAnalysis();if(b.dataset.p==='history')renderHistory()});$('form').onsubmit=e=>{e.preventDefault();let x={date:$('date').value,content:$('content').value.trim(),amount:+$('amount').value,category:$('category').value,memo:$('memo').value.trim()};if(!x.content||!x.amount)return;data.push(x);save();e.target.reset();$('category').value='食費';render()};$('today').onclick=()=>{let d=new Date();$('date').value=new Date(d-d.getTimezoneOffset()*60000).toISOString().slice(0,10)};$('toAnalysis').onclick=()=>document.querySelector('[data-p="analysis"]').click();$('month').onchange=renderAnalysis;$('saveReason').onclick=()=>{let m=$('month').value;if(!m)return;reasons[m]=$('reason').value.trim();saveR();alert('保存しました')};$('search').oninput=renderHistory;$('tbody').onclick=e=>{let b=e.target.closest('button[data-i]');if(!b)return;let i=+b.dataset.i;if(confirm('削除しますか？')){data.splice(i,1);save();render()}};function dl(txt,name,type){let a=document.createElement('a'),u=URL.createObjectURL(new Blob([txt],{type}));a.href=u;a.download=name;a.click();URL.revokeObjectURL(u)}$('csv').onclick=()=>{let r=[['日付','内容','金額','カテゴリ','メモ'],...data.map(x=>[x.date,x.content,x.amount,x.category,x.memo])];dl('\ufeff'+r.map(a=>a.map(v=>'"'+String(v??'').replaceAll('"','""')+'"').join(',')).join('\r\n'),'kakeibo.csv','text/csv')};$('backup').onclick=()=>dl(JSON.stringify({version:1,entries:data,reasons},null,2),'kakeibo_backup.json','application/json');$('restore').onclick=()=>$('restoreFile').click();$('restoreFile').onchange=async e=>{let f=e.target.files[0];e.target.value='';if(!f)return;try{let j=JSON.parse(await f.text()),arr=Array.isArray(j)?j:j.entries;if(!Array.isArray(arr))throw 0;if(confirm(arr.length+'件を復元しますか？')){data=clone(arr);reasons=j.reasons||j.monthReasons||{};save();saveR();render()}}catch{alert('読み込めないJSONです')}};$('reset').onclick=()=>{if(confirm('家計簿データを空にしますか？')){data=[];reasons={};save();saveR();render()}};if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js'));$('today').click();render();</script></body></html>
